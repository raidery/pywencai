[project]
name = "pywencai"
version = "0.15.0"
description = ""
readme = "README.md"
authors = [
    {name = "pluto", email = "mayuanchi1029@gmail.com"},
]
requires-python = ">=3.12"
dependencies = [
    "requests",
    "pandas>=1.5.0",
    "fake-useragent>=1.1.1,<2.0.0",
    "pydash>=7.0.3,<8.0.0",
]

[project.optional-dependencies]
dev = [
    "notebook>=6.4.12,<7.0.0",
    "mypy>=1.2.0,<2.0.0",
    "autopep8>=2.0.2,<3.0.0",
    "types-requests>=2.30.0.0,<3.0.0.0",
]
playwright = [
    "playwright>=1.40.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pywencai"]

[tool.hatch.build.targets.wheel.include]
files = ["pywencai/hexin-v.bundle.js", "pywencai/default-stylesheet.css"]
